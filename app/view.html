<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>그리움 — 어르신의 작품</title>
<style>
  :root{
    --ground:#F4F5F3; --surface:#FFFFFF; --line:#E2E4E0;
    --ink:#2B2F2D; --ink-2:#585E5A; --muted:#8A908B;
    --accent:#8C3A2E; --accent-soft:#F3E7E3;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    --display:'Nanum Myeongjo','Noto Serif KR',serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ground:#151918; --surface:#1D2322; --line:#2C3331;
           --ink:#E8ECEA; --ink-2:#AEB4B0; --muted:#7E847F;
           --accent:#D98A78; --accent-soft:#2E2320; --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--ground); color:var(--ink);
    font-family:'Noto Sans KR',system-ui,sans-serif; line-height:1.6;
    padding:env(safe-area-inset-top) 0 3rem}
  .wrap{max-width:640px; margin:0 auto; padding:1.25rem}

  /* 머리 */
  header{text-align:center; padding:1.5rem 0 1rem}
  .eyebrow{font-size:.78rem; letter-spacing:.14em; color:var(--accent); font-weight:700; margin:0}
  h1{font-family:var(--display); font-size:1.9rem; line-height:1.35; margin:.4rem 0 .2rem}
  .sub{color:var(--ink-2); font-size:.95rem; margin:0}

  /* 상태 */
  .state{text-align:center; padding:3rem 1rem; color:var(--muted)}
  .state .big{font-size:1.1rem; color:var(--ink-2); margin-bottom:.4rem}
  .spin{width:34px; height:34px; margin:0 auto 1rem; border:3px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* 작품 카드 */
  .count{text-align:center; color:var(--muted); font-size:.86rem; margin:.2rem 0 1.2rem}

  /* 시기 구분 — 연대기의 눈금.
     스크롤하며 내려갈 때 「지금 어느 시절을 보고 있는지」가 늘 보이도록 위에 붙는다. */
  .era{display:flex; align-items:baseline; gap:.6rem; position:sticky; top:0; z-index:5;
    background:var(--ground); padding:.9rem 0 .5rem; margin-top:.4rem;
    border-bottom:1px solid var(--line)}
  .era + .card{margin-top:.9rem}
  .era-name{font-family:var(--display); font-size:1.15rem; color:var(--ink); letter-spacing:.02em}
  .era-n{font-size:.78rem; color:var(--muted); margin-left:auto}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden; margin-bottom:1.1rem}
  .card .ph{display:block; width:100%; background:var(--surface); cursor:zoom-in;
    border:none; padding:0; line-height:0}
  .card .ph img{width:100%; height:auto; display:block}
  .card .ph .skel{width:100%; aspect-ratio:4/3; background:
    linear-gradient(100deg,var(--surface-2,#eee) 30%,var(--line) 50%,var(--surface-2,#eee) 70%);
    background-size:200% 100%; animation:sk 1.3s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}
  .card .meta{padding:.8rem 1rem 1rem}
  .card .date{font-size:.8rem; color:var(--accent); font-weight:700; letter-spacing:.02em}
  .card .note{margin:.3rem 0 0; font-size:1.02rem; color:var(--ink)}
  .card .note.empty{color:var(--muted); font-size:.92rem}

  footer{text-align:center; color:var(--muted); font-size:.78rem; margin-top:2rem; line-height:1.7}

  /* 원본 크게 */
  .box{position:fixed; inset:0; background:rgba(0,0,0,.88); display:none;
    align-items:center; justify-content:center; padding:1rem; z-index:50; cursor:zoom-out}
  .box.on{display:flex}
  .box img{max-width:100%; max-height:100%; border-radius:6px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">그리움</p>
      <h1 id="title">작품을 불러오는 중…</h1>
      <p class="sub" id="sub">잠시만 기다려 주세요</p>
    </header>
    <div id="view">
      <div class="state"><div class="spin"></div><div>불러오는 중…</div></div>
    </div>
    <footer>
      센터에서 어르신이 남긴 작품입니다.<br>
      이 링크는 가족에게만 보내는 것입니다.
    </footer>
  </div>

  <div class="box" id="box" role="dialog" aria-label="작품 원본"><img alt=""></div>

<script src="js/config.js?v=22"></script>
<script>
(function () {
  "use strict";
  var URL_ = (window.CONFIG && CONFIG.supabaseUrl) || '';
  var KEY  = (window.CONFIG && CONFIG.supabaseKey) || '';
  var BUCKET = 'artworks';

  var titleEl = document.getElementById('title');
  var subEl   = document.getElementById('sub');
  var viewEl  = document.getElementById('view');
  var box     = document.getElementById('box');
  var boxImg  = box.querySelector('img');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

  /* 토큰은 주소 해시(#t=)에 둔다 — 서버 로그·리퍼러에 안 남는다 */
  function token(){
    var h = location.hash || '';
    var m = h.match(/[#&]t=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function state(html){ viewEl.innerHTML = '<div class="state">' + html + '</div>'; }

  function fail(msg){
    titleEl.textContent = '작품을 열 수 없습니다';
    subEl.textContent = '';
    state('<div class="big">' + esc(msg) + '</div>' +
          '<div>링크를 보내주신 분께 다시 문의해 주세요.</div>');
  }

  /* 날짜: 2026-07-24 → 2026년 7월 24일 */
  function humanDate(s){
    if(!s) return '';
    var p = String(s).split('-');
    if(p.length!==3) return s;
    return p[0]+'년 '+Number(p[1])+'월 '+Number(p[2])+'일';
  }

  /* ── 연대기: 기록을 「시기」로 묶는다 ──────────────────────────
   * 설계 원칙 3 — **날짜를 몰라도 된다.**
   *   옛 사진에는 날짜가 없다. 「1970년대쯤」·「환갑 무렵」으로도 놓인다.
   *   예전 화면은 occurred_at 만 읽어서 **옛 사진이 빈칸**으로 나왔다.
   *
   * 설계 원칙 2 — **눈금이 균등하지 않다.**
   *   시기마다 블록을 만들고 그 안에 사진을 넣으므로,
   *   사진이 많은 시기가 저절로 길어진다. 따로 계산하지 않는다.
   *
   * ⏸ 오늘 안 만든 것 (다음 회차)
   *   · 원칙 1 「생년만 알면 축이 선다」 — 생년을 서버가 안 내려준다
   *   · 원칙 4 「빈칸은 초대장이다」 — 가족이 올리는 기능과 한 몸이다
   */

  /* 시기 힌트를 객체로 편다.
     DB 는 글자로 준다(`store-supa` 가 JSON 으로 담아 보내므로).
     옛 데이터가 맨 글자일 수도 있어 그때는 「사건」으로 살린다. */
  function parseHint(h){
    if(!h) return null;
    if(typeof h === 'string'){
      var s = h.trim();
      try{
        var o = JSON.parse(s);
        return (o && typeof o === 'object') ? o : {type:'event', value:s};
      }catch(e){
        /* 🔑 「옛 맨 글자」와 「깨진 JSON」을 갈라야 한다.
           맨 글자(예: "환갑 무렵")는 사건 이름으로 살린다.
           그런데 `{` 로 시작하다 잘린 것은 **JSON 이 깨진 것**이므로,
           그대로 살리면 `{"type":"decade","value":"1970"` 이 통째로
           **시기 제목이 되어 화면에 뜬다.** 그건 이름이 아니라 부스러기다. */
        if(s.charAt(0) === '{' || s.charAt(0) === '[') return null;   /* → 「모름」 */
        return {type:'event', value:s};
      }
    }
    return (typeof h === 'object') ? h : null;
  }

  /* 🔴 2026-07-30 — 망가진 값을 **여기서** 걸러낸다.
   *
   * 테스트 마스터가 실제 값으로 재현한 것:
   *   {type:'decade'} (value 없음) 한 건이 섞이면
   *     · 칸 제목이 **「undefined년대」** 로 뜨고
   *     · 정렬값이 **NaN** 이 되어 **연대기 전체 순서가 무너졌다**
   *       (2020년 1월이 1970년대 아래로 밀렸다)
   *
   * 라벨과 정렬 두 곳을 각각 막을 수도 있었지만, **뿌리에서 막는 편**이 낫다 —
   * 여기서 「모름」으로 보내면 라벨·정렬·묶기가 한 번에 안전해지고,
   * 화면에는 **「시기를 알 수 없는 것」** 이라는 **정직한 말**이 남는다.
   *
   * ⚠️ 지금 앱 UI 로는 이런 값이 안 만들어진다(연대 목록이 고정이라).
   *    위험은 ①손으로 넣은 DB 행 ②앞으로 만들 자유입력 ③옛 데이터다. */
  function decadeOf(v){
    var n = Number(String(v == null ? '' : v).trim());
    /* 사람이 살아온 시기로 말이 되는 범위만 받는다 */
    return (isFinite(n) && n >= 1900 && n <= 2100) ? String(Math.floor(n)) : null;
  }
  function monthOf(v){
    var m = String(v == null ? '' : v).slice(0, 7).match(/^(\d{4})-(\d{2})$/);
    if(!m) return null;
    var mm = Number(m[2]);
    return (mm >= 1 && mm <= 12) ? m[1] + '-' + m[2] : null;
  }

  /* 이 기록이 어느 시기 칸에 들어가나 — 묶는 열쇠 */
  function bucketKey(r){
    var h = parseHint(r && r.occurred_hint);
    if(h){
      if(h.type === 'decade'){
        var d = decadeOf(h.value);
        return d ? 'D' + d : 'U';                             /* 망가졌으면 「모름」 */
      }
      if(h.type === 'event'){
        var t = String(h.value == null ? '' : h.value).trim();
        return t ? 'E' + t : 'U';
      }
      return 'U';                                             /* 시기 모름 */
    }
    var mo = monthOf(r && r.occurred_at);
    return mo ? 'M' + mo : 'U';                               /* 2026-07 */
  }

  /* 그 칸을 사람 말로.
     ⚠️ bucketKey 가 이미 걸렀지만, 누가 이 함수를 따로 부를 수도 있어 한 겹 더 막는다. */
  function bucketLabel(key){
    if(!key || key === 'U') return '시기를 알 수 없는 것';
    if(key.charAt(0) === 'D'){
      var d = decadeOf(key.slice(1));
      return d ? d + '년대' : '시기를 알 수 없는 것';
    }
    if(key.charAt(0) === 'E') return key.slice(1) || '어느 무렵';
    var mo = monthOf(key.slice(1));
    if(!mo) return '시기를 알 수 없는 것';
    var p = mo.split('-');
    return p[0] + '년 ' + Number(p[1]) + '월';
  }

  /* 최근이 위로. 「시기 모름」은 맨 아래 —
     직원 화면(store-idb)이 빈 날짜를 아래로 보내는 것과 같은 규칙이다.
     🔑 **어떤 입력에도 NaN 을 내지 않는다** — NaN 하나가 정렬 전체를 오염시킨다. */
  var RANK_UNKNOWN = -1e9;
  function bucketRank(key){
    if(!key || key === 'U') return RANK_UNKNOWN;
    if(key.charAt(0) === 'D'){
      var d = decadeOf(key.slice(1));
      return d ? Number(d) * 100 : RANK_UNKNOWN;              /* 1970 → 197000 */
    }
    if(key.charAt(0) === 'E') return -1e8;                    /* 사건은 연대 아래 */
    var mo = monthOf(key.slice(1));
    if(!mo) return RANK_UNKNOWN;
    var p = mo.split('-');
    return Number(p[0]) * 100 + Number(p[1]);
  }

  /* 카드 안에 쓸 날짜.
     시기 묶음 제목에 이미 「1970년대」·「2026년 7월」이 있으므로,
     여기서는 **겹치지 않는 만큼만** 쓴다.
     ⚠️ 옛 사진(시기 힌트)은 여기서 빈칸을 돌려준다 — 그래서 제목이 유일한 단서다. */
  function cardWhen(r){
    if(!r) return '';
    if(r.occurred_hint) return '';                   /* 제목이 이미 말했다 */
    if(!r.occurred_at) return '';
    var p = String(r.occurred_at).split('-');
    return p.length === 3 ? Number(p[1])+'월 '+Number(p[2])+'일' : '';
  }

  /* 시기 제목을 붙일까
   *
   * 원래 규칙은 「시기가 하나뿐이면 안 붙인다」였다.
   * 이유는 **「모두 3점」 밑에 「2026년 7월 · 3점」이 붙으면 같은 말이 두 번**이라서다.
   *
   * 🔴 2026-07-30 정정 — 그 이유는 **카드에 날짜가 뜰 때만** 성립한다.
   *    옛 사진만 있으면(예: 1970년대 3장) 시기 칸이 1개라 제목이 안 그려지는데,
   *    카드 날짜도 빈칸이라 **골라둔 「1970년대」가 화면 어디에도 안 나왔다.**
   *    직원이 고른 값을 가족이 볼 수 없었다. (개발 마스터 발견, 실제 값으로 재현)
   *
   * 그래서 규칙을 이렇게 바꾼다:
   *   **카드가 시기를 못 보여주면, 한 칸뿐이라도 제목을 붙인다.**
   */
  function needEras(groups){
    if(!groups || !groups.length) return false;
    if(groups.length > 1) return true;               /* 나눌 것이 있으면 붙인다 */
    return !cardWhen(groups[0].items[0]);            /* 카드가 비면 제목이 유일한 단서 */
  }

  function groupByPeriod(recs){
    var map = {}, order = [];
    recs.forEach(function(r){
      var k = bucketKey(r);
      if(!map[k]){ map[k] = []; order.push(k); }
      map[k].push(r);
    });
    order.sort(function(a,b){ return bucketRank(b) - bucketRank(a); });
    return order.map(function(k){ return { key:k, label:bucketLabel(k), items:map[k] }; });
  }

  /* 사진이 하나도 안 남으면(전부 실패·폐기 직후 등) 안내로 바꾼다 —
     카드는 0인데 "모두 N점"만 남는 어긋남을 막는다 */
  function checkEmpty(){
    if(!viewEl.querySelector('.card')){
      fail('작품을 불러오지 못했습니다. 링크가 만료되었거나 잠시 문제가 있을 수 있어요.');
    }
  }

  /* 카드 한 장을 빼면서 **주변 숫자까지 함께 맞춘다**
   *
   * 🔴 2026-07-30 — 여기가 비어 있었다.
   *    사진 한 장이 안 열리면 `card.remove()` 만 했다. 그 결과:
   *      · 그 시기에 카드가 0장이 돼도 **제목과 「3점」이 그대로 남았다** (유령 제목)
   *      · 맨 위 「모두 11점」도 그대로라 **보이는 장수와 안 맞았다**
   *    센터 와이파이가 흔들리는 시연장에서 그대로 보인다.
   *    (개발·테스트 마스터가 같이 지적)
   *
   * 화면은 이렇게 평평하게 놓여 있다 — 카드는 자기 시기 제목의 **뒤에 오는 형제**다:
   *      <p class="count">   <div class="era">   <div class="card">…  <div class="era">…
   *    그래서 앞으로 거슬러 올라가며 가장 가까운 .era 를 찾는다. */
  function dropCard(card){
    if(!card || !card.parentNode) return;

    /* ① 이 카드가 어느 시기에 속하나 — 앞으로 거슬러 올라간다 */
    var era = null, p = card.previousElementSibling;
    while(p){
      if(p.classList.contains('era')){ era = p; break; }
      p = p.previousElementSibling;
    }

    card.remove();

    /* ② 그 시기에 카드가 몇 장 남았나 — 다음 .era 를 만나기 전까지 센다 */
    if(era){
      var left = 0, q = era.nextElementSibling;
      while(q && !q.classList.contains('era')){
        if(q.classList.contains('card')) left++;
        q = q.nextElementSibling;
      }
      if(left === 0) era.remove();                 /* 유령 제목을 남기지 않는다 */
      else {
        var n = era.querySelector('.era-n');
        if(n) n.textContent = left + '점';
      }
    }

    /* ③ 맨 위 「모두 N점」도 보이는 것과 맞춘다 */
    var total = viewEl.querySelectorAll('.card').length;
    var cnt = viewEl.querySelector('.count');
    if(cnt) cnt.textContent = '모두 ' + total + '점';

    checkEmpty();
  }

  /* ── 사진 받기 ──────────────────────────────────────────────
   * 🔴 예전에는 **창고에 직접** 손을 뻗었다:
   *      fetch(창고주소 + 사진경로, {apikey: 공개열쇠})   ← 창고를 직접 불렀다
   *    그러려면 창고를 anon 에게 열어야 했고, 그 결과 **공유 링크가 하나만
   *    살아 있어도 그 센터 사진이 전부 열거**됐다. (R-58, 2026-07-28 실측)
   *    2026-07-30 에 다시 재봤을 때도 폴더와 파일 이름이 그대로 나왔다.
   *
   * 이제는 서버 프로그램에 **토큰과 사진 번호**를 주고 시간 제한 주소를 받는다.
   *   · 창고 주소를 화면이 아예 모른다
   *   · 받은 주소는 4시간 뒤 스스로 닫힌다
   *   · 남의 사진 번호를 넣으면 서버가 거절한다 (DB 가 어르신을 재확인)
   *
   * ⚠️ 이 파일이 창고 주소를 직접 부르면 그것이 곧 구멍이다.
   *    `app/_check.js` 가 커밋 때 감시한다.
   */
  function signedUrl(recId, thumb){
    return fetch(URL_+'/functions/v1/photo?t='+encodeURIComponent(token())+
                 '&r='+encodeURIComponent(recId)+(thumb ? '&thumb=1' : ''), {
      headers: { apikey: KEY, Authorization: 'Bearer '+KEY }
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.url) ? j.url : null; })
      .catch(function(){ return null; });
  }

  function loadPhoto(recId, imgEl){
    var card = imgEl.closest('.card');
    signedUrl(recId, true).then(function(u){
      if(!u){ dropCard(card); return; }   /* 못 받으면 그 카드와 주변 숫자를 함께 뺀다 */
      var sk = imgEl.parentNode.querySelector('.skel');
      if(sk) sk.remove();
      imgEl.src = u;                    /* 브라우저가 직접 받는다 — blob 을 안 거친다 */
    });
  }

  function openBig(recId){
    signedUrl(recId, false).then(function(u){
      if(u){ boxImg.src = u; box.classList.add('on'); }
      /* 실패하면 조용히 넘어간다 — 썸네일은 이미 떠 있다 */
    });
  }
  box.addEventListener('click', function(){ box.classList.remove('on'); boxImg.src=''; });

  function render(data){
    var name = (data.elder && data.elder.name) || '어르신';
    var recs = data.records || [];
    titleEl.textContent = name + ' 어르신의 작품';
    subEl.textContent = '센터에서 남긴 기록입니다';

    if(!recs.length){
      state('<div class="big">아직 올라온 작품이 없습니다.</div>' +
            '<div>곧 채워질 거예요.</div>');
      return;
    }

    var groups = groupByPeriod(recs);
    var flat = [];                                   /* 그린 순서 — data-i 가 이걸 가리킨다 */
    var html = '<p class="count">모두 ' + recs.length + '점</p>';

    /* 규칙과 이유는 needEras() 에 적어 두었다 */
    var showEras = needEras(groups);

    groups.forEach(function(g){
      if(showEras) html += '<div class="era">' +
                '<span class="era-name">' + esc(g.label) + '</span>' +
                '<span class="era-n">' + g.items.length + '점</span>' +
              '</div>';
      g.items.forEach(function(r){
        var i = flat.length;
        flat.push(r);
        var when = cardWhen(r);
        html +=
          '<div class="card">' +
            '<button class="ph" data-i="'+i+'" aria-label="작품 크게 보기">' +
              '<span class="skel"></span>' +
              '<img alt="'+esc(name)+' 어르신의 작품">' +
            '</button>' +
            '<div class="meta">' +
              (when ? '<div class="date">' + esc(when) + '</div>' : '') +
              (r.note ? '<p class="note">' + esc(r.note) + '</p>'
                      : '<p class="note empty">—</p>') +
            '</div>' +
          '</div>';
      });
    });
    viewEl.innerHTML = html;

    /* 썸네일 로드 + 클릭 시 원본 */
    var imgs = viewEl.querySelectorAll('.card .ph img');
    /* 🔑 경로가 아니라 **사진 번호**를 넘긴다.
       경로를 화면이 알 필요가 없어졌다 — 그게 이 변경의 핵심이다.
       썸네일이 없는 기록은 서버가 원본으로 알아서 답한다. */
    imgs.forEach(function(img, i){ loadPhoto(flat[i].id, img); });
    viewEl.querySelectorAll('.ph').forEach(function(btn){
      btn.addEventListener('click', function(){
        openBig(flat[+btn.dataset.i].id);
      });
    });
  }

  /* ── 시작 ── */
  var t = token();
  if(!t){ fail('링크가 올바르지 않습니다.'); return; }

  fetch(URL_+'/rest/v1/rpc/get_shared', {
    method:'POST',
    headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ p_token: t })
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(!data || !data.elder){ fail('링크가 만료되었거나 올바르지 않습니다.'); return; }
      render(data);
    })
    .catch(function(){ fail('불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'); });
})();
</script>
</body>
</html>
